# Builds WideLong and runs the synthetic verification suite, including native R replays of the generated cleaning code.
# Uses only the fictional fixtures in tests/; no datasets are involved.
name: checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: 'release'
      - name: Build and verify
        shell: pwsh
        run: ./Build.ps1 -Test -Rscript (Get-Command Rscript).Source
